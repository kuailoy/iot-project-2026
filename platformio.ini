; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]

platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/load_env.py
build_flags =
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-esp32s3-libs/include
    ; Test mode: 1 = show every UI page in turn, forever (input and sleep off)
    ;            0 = normal firmware
    -D UI_DEMO_MODE=1
    ; E-Ink refresh (details: README, "E-Ink display driver")
    ;   EPD_MODE: 0 = stock black/white/red (~29 s)
    ;             1 = black/white, panel's own waveform
    ;             2 = black/white, fast waveforms from src/display/EinkLuts.h
    -D EPD_MODE=2
    ; Frame rate in Hz (50 = default; 70 / 100 make every waveform shorter)
    -D EPD_FRAME_RATE=50
    ; Modes 0/1: force the temperature (C) used to pick the waveform, -128 = off
    -D EPD_FORCE_TEMP=-128
    ; Keep the booster on this many ms for quick follow-up updates, 0 = off
    -D EPD_KEEP_POWER_MS=0
    ; Mode 2: deep-clean refresh after this many fast updates
    -D EPD_CLEAN_EVERY=10
    ; 1 = run the timing benchmark instead of the app (see serial monitor)
    -D EPD_BENCHMARK=0
lib_deps =
    adafruit/Adafruit EPD
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
    sensirion/Sensirion I2C SCD4x
    adafruit/Adafruit seesaw Library
    bblanchon/ArduinoJson

