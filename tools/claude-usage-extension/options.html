<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Claude usage for the desk display</title>
<style>
  body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         width: 320px; margin: 16px; color: #111; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; font: inherit;
          border: 1px solid #ccc; border-radius: 6px; }
  .hint { color: #666; font-size: 12px; margin-top: 4px; }
  .buttons { display: flex; gap: 8px; margin-top: 16px; }
  button { flex: 1; padding: 9px; font: inherit; font-weight: 600; border: 0; border-radius: 6px;
           background: #111; color: #fff; cursor: pointer; }
  button.second { background: #eee; color: #111; }
  #status { margin-top: 14px; color: #444; }
</style>
</head>
<body>
  <h1>Claude usage for the desk display</h1>

  <label for="org">Organization ID</label>
  <input id="org" placeholder="db919c62-...">
  <div class="hint">From claude.ai/settings/usage: DevTools &rarr; Network &rarr;
    the request <code>/api/organizations/&lt;this ID&gt;/usage</code>.</div>

  <label for="device">Display address</label>
  <input id="device" placeholder="desk.local">
  <div class="hint">desk.local, or the IP shown on the display (Menu &rarr; Settings).</div>

  <label for="minutes">Send every (minutes)</label>
  <input id="minutes" type="number" min="1" placeholder="5">

  <div class="buttons">
    <button id="save">Save</button>
    <button id="send" class="second">Send now</button>
  </div>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
